<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("Cinzel.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
    }
    @font-face {
      font-family: "Playfair";
      src: url("Playfair.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #14110e;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
    }
    .photo {
      position: absolute;
      inset: 0;
      background: #14110e url("facade.jpg") center / cover no-repeat;
      filter: saturate(1.08) contrast(1.06);
    }
    .scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(20, 17, 14, 0.58) 0%,
          rgba(20, 17, 14, 0.22) 38%,
          rgba(20, 17, 14, 0.28) 58%,
          rgba(20, 17, 14, 0.62) 100%
        ),
        radial-gradient(
          ellipse 70% 65% at 50% 48%,
          rgba(20, 17, 14, 0.08) 0%,
          rgba(20, 17, 14, 0.42) 100%
        );
    }
    .frame {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(244, 239, 230, 0.28);
      pointer-events: none;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 780px;
      text-align: center;
      color: #f4efe6;
    }
    .eyebrow {
      margin: 0 0 18px;
      font-family: "Cinzel", Georgia, serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.46em;
      text-indent: 0.46em;
      text-transform: uppercase;
      color: #c4b5a0;
    }
    .title {
      margin: 0;
      font-family: "Cinzel", Georgia, serif;
      font-weight: 600;
      font-size: 64px;
      line-height: 0.98;
      letter-spacing: 0.14em;
      text-indent: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 2px 18px rgba(20, 17, 14, 0.55);
    }
    .title span {
      display: block;
    }
    .rule {
      width: 72px;
      height: 2px;
      margin: 22px auto 18px;
      background: #9b2335;
    }
    .place {
      margin: 0;
      font-family: "Playfair", Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      color: #c4b5a0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="photo"></div>
    <div class="scrim"></div>
    <div class="frame"></div>
    <div class="lockup">
      <p class="eyebrow">Boutique Hotel</p>
      <h1 class="title"><span>Grand Art</span><span>Premium</span></h1>
      <div class="rule"></div>
      <p class="place">Tashkent</p>
    </div>
  </div>
</body>
</html>
